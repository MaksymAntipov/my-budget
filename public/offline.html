<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>MySkrynia — немає з'єднання</title>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    box-sizing: border-box;
    background: radial-gradient(circle at top right, #2c2c2e 0%, #000 100%);
    color: #f5f5f7;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    text-align: center;
  }
  main { max-width: 340px; }
  img { width: 88px; height: 88px; border-radius: 22px; }
  h1 { font-size: 24px; margin: 20px 0 8px; }
  p { color: #a1a1a6; font-size: 16px; line-height: 1.5; margin: 0 0 24px; }
  a {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 52px;
    padding: 0 28px;
    border-radius: 16px;
    background: #fff;
    color: #000;
    font-size: 17px;
    font-weight: 700;
    text-decoration: none;
  }
</style>
</head>
<body>
<main>
  <img src="/icons/icon-192.png" alt="">
  <h1>Немає з'єднання</h1>
  <p>Скриня зберігає дані на сервері, тож без інтернету відкрити їх не вийде. Перевірте мережу й спробуйте ще раз.</p>
  <a href="/">Спробувати ще раз</a>
</main>
</body>
</html>
